name: ncbittner

services:
  nginx:
    image: nginx:latest
    ports:
      - "31080:80"
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
      - ./public:/app/public:ro
    depends_on:
      - php-fpm
    healthcheck:
      test: ["CMD-SHELL", "curl -fL http://localhost:80 || exit 1"]
      interval: 20s
      start_period: 10s
      timeout: 10s
      retries: 3

  php-fpm:
    build:
      context: .
      dockerfile: ./docker/php/Dockerfile
      target: base
